<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">dnzlfx — full-stack developer · local-first AI</title>
  <desc id="desc">Dark terminal-style header for dnzlfx's GitHub profile.</desc>
  <defs>
