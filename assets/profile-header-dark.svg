      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8b9bb4" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
