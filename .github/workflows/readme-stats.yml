name: Update README stats

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/readme-stats.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Generate dark GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&rank_icon=github&bg_color=0d1117&title_color=39d353&text_color=c9d1d9&icon_color=a78bfa&locale=en&custom_title=Christian%20Denzel%27s%20GitHub%20Stats
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate light GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&rank_icon=github&bg_color=ffffff&title_color=1a7f37&text_color=24292f&icon_color=6f42c1&locale=en&custom_title=Christian%20Denzel%27s%20GitHub%20Stats
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats-dark.svg profile/stats-light.svg
          git commit -m "Update profile stats" || exit 0
          git push
